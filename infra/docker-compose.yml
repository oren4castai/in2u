services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: src/In2U.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: in2u
      Jwt__Audience: in2u-app
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Admin__SeedEmail: ${ADMIN_SEED_EMAIL}
      Admin__SeedPassword: ${ADMIN_SEED_PASSWORD}
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"
    restart: unless-stopped

volumes:
  pgdata: {}

# First-time certificate issuance (run once after DNS is pointed at this server):
#   docker compose run --rm --entrypoint "" certbot certbot certonly \
#       --webroot -w /var/www/certbot \
#       -d api.example.com \
#       --email you@example.com --agree-tos --no-eff-email
# Then update infra/nginx/nginx.conf to replace <DOMAIN> with api.example.com and reload nginx:
#   docker compose exec nginx nginx -s reload
