name: in2u
description: In2U mobile client.
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  signalr_netcore: ^1.4.0
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  flutter_card_swiper: ^7.0.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo.png
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/global.png
    - assets/logo.png
